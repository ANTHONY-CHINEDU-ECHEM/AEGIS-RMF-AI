# Production style stack: Neo4j for the knowledge graph, Qdrant for vectors, FastAPI for access.
# Start with: docker compose up
# Pin the qdrant image to the release that matches the installed qdrant_client before real use.
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/aegis_password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  api:
    build: .
    environment:
      AEGIS_GRAPH_BACKEND: neo4j
      AEGIS_NEO4J_URI: bolt://neo4j:7687
      AEGIS_NEO4J_USER: neo4j
      AEGIS_NEO4J_PASSWORD: aegis_password
      AEGIS_QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on: [neo4j, qdrant]

volumes:
  neo4j_data: {}
  qdrant_data: {}
